name: Petra safety checks

on:
  push:
    branches:
      - production-hardening-paper
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend compile and strategy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-xdist
      - name: Compile backend
        run: python -m compileall -q backend api
      - name: Import FastAPI application
        env:
          ALPACA_MODE: "mock"
        run: python -c "import sys; sys.path.insert(0, 'backend'); import server; print('FastAPI import OK, mode=', server.alpaca.mode)"
      - name: Run backend safety tests
        run: pytest backend/tests/test_strategy_demonstration.py backend/tests/test_worker_settings.py -q

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile
      - name: Build dashboard
        env:
          CI: "true"
          REACT_APP_BACKEND_URL: ""
        run: yarn build


  vercel-runtime-smoke:
    name: Vercel runtime import smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install root Vercel dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Exercise Vercel FastAPI startup and health route
        env:
          VERCEL: "1"
          ALPACA_MODE: "mock"
          AGENT_CYCLE_SECONDS: ""
          TICK_MAX_CANDIDATES: ""
          MONGO_SERVER_SELECTION_TIMEOUT_MS: ""
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from api.index import app
          with TestClient(app) as client:
              response = client.get("/api/health")
              print("health", response.status_code, response.text)
              assert response.status_code == 200
              auth = client.get("/api/auth/status")
              print("auth", auth.status_code, auth.text)
              assert auth.status_code == 200
          PY


  worker-safety:
    name: Paper worker safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-worker.txt
      - name: Install worker dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-worker.txt pytest pytest-xdist
      - name: Compile and import worker
        run: |
          python -m compileall -q backend/settings.py backend/store.py backend/worker.py
          python -c "import sys; sys.path.insert(0, 'backend'); import worker; print('worker import OK')"
      - name: Verify paper-only fail-closed settings
        run: pytest backend/tests/test_worker_settings.py -q
