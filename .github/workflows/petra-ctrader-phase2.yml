name: Petra cTrader Phase 2 probe

on:
  workflow_dispatch:
    inputs:
      host:
        description: cTrader endpoint to inspect
        required: true
        default: demo
        type: choice
        options:
          - demo
          - live
      symbols:
        description: Comma-separated broker symbols to probe
        required: false
        default: EURUSD,XAUUSD,US500,NAS100
        type: string

permissions:
  contents: read

jobs:
  probe:
    name: cTrader symbol and margin probe
    runs-on: ubuntu-latest
    environment: ctrader-pilot
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install cTrader adapter dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run read-only symbol and margin probe
        working-directory: backend
        env:
          ALLOW_LIVE_TRADING: "false"
          PETRA_CTRADER_ENV: ${{ inputs.host }}
          PETRA_CTRADER_DRY_RUN: "true"
          PETRA_CTRADER_PILOT_ARMED: "false"
          PETRA_CTRADER_EXECUTION_CONFIRM: ""
          CTRADER_PROBE_SYMBOLS: ${{ inputs.symbols }}
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
          CTRADER_EXPECTED_ACCOUNT_ID: ${{ secrets.CTRADER_EXPECTED_ACCOUNT_ID }}
        run: python ctrader_phase2_probe.py
