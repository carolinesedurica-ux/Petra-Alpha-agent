name: One-shot export research basket

on:
  push:
    branches:
      - trend-basket-research
    paths:
      - .github/workflows/export-research-basket-once.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: trend-basket-research
          fetch-depth: 0

      - name: Export and validate D1 research basket
        shell: bash
        env:
          PETRA_HISTORY_BASE_URL: https://petra-alpha-agent.onrender.com
        run: |
          set -euo pipefail
          mkdir -p data/research_basket
          : > /tmp/history_ranges.txt

          for S in XAUUSD XAGUSD SpotCrude NatGas US500 NAS100 GER40 UK100; do
            OUT="data/research_basket/${S}_d1.csv"
            URL="${PETRA_HISTORY_BASE_URL}/api/ctrader/history.csv?days=4500&period=D1&symbol=${S}"
            echo "Exporting ${S}..."
            curl --fail --show-error --location --retry 4 --retry-delay 5 --max-time 700               "${URL}" -o "${OUT}"

            HEADER="$(head -n 1 "${OUT}" | tr -d '\r')"
            if [ "${HEADER}" != "time,open,high,low,close" ]; then
              echo "Unexpected CSV header for ${S}: ${HEADER}" >&2
              exit 1
            fi

            ROWS=$(( $(wc -l < "${OUT}") - 1 ))
            if [ "${ROWS}" -lt 250 ]; then
              echo "Too few daily rows for ${S}: ${ROWS}" >&2
              exit 1
            fi

            FIRST="$(sed -n '2p' "${OUT}" | cut -d, -f1 | tr -d '\r')"
            LAST="$(tail -n 1 "${OUT}" | cut -d, -f1 | tr -d '\r')"
            printf '%s,%s,%s,%s\n' "${S}" "${ROWS}" "${FIRST}" "${LAST}" | tee -a /tmp/history_ranges.txt
          done

          echo
          echo "symbol,rows,first,last"
          cat /tmp/history_ranges.txt

      - name: Commit exported CSVs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research_basket/*_d1.csv
          if git diff --cached --quiet; then
            echo "No CSV changes to commit."
            exit 0
          fi
          git commit -m "Add pre-registered daily research basket data"
          git push origin HEAD:trend-basket-research
