name: Petra one-contract paper entry pilot

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Run one Alpaca PAPER entry cycle"
        required: true
        default: "NO"
        type: choice
        options:
          - "NO"
          - "RUN_ONE_PAPER_ENTRY_CYCLE"

permissions:
  contents: read

concurrency:
  group: petra-paper-worker
  cancel-in-progress: false

jobs:
  run:
    if: inputs.confirm == 'RUN_ONE_PAPER_ENTRY_CYCLE'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: paper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-worker.txt

      - name: Install worker dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-worker.txt

      - name: Configure one-contract paper-entry limits
        working-directory: backend
        env:
          PETRA_BROKER_ENV: paper
          ALLOW_LIVE_TRADING: "false"
          ALPACA_PAPER_API_KEY: ${{ secrets.ALPACA_PAPER_API_KEY }}
          ALPACA_PAPER_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}
          ALPACA_EXPECTED_ACCOUNT_NUMBER: ${{ secrets.ALPACA_EXPECTED_ACCOUNT_NUMBER }}
          MONGO_URL: ${{ secrets.PETRA_WORKER_MONGO_URL }}
          DB_NAME: ${{ vars.PETRA_DB_NAME || 'petra_paper' }}
          FEATHERLESS_API_KEY: ${{ secrets.FEATHERLESS_API_KEY }}
          ALPACA_OPTIONS_FEED: ${{ vars.ALPACA_OPTIONS_FEED || 'indicative' }}
          PETRA_ENTRIES_ENABLED: "false"
          PETRA_DRY_RUN: "true"
          TICK_MAX_CANDIDATES: "1"
          PETRA_LEASE_TTL_SECONDS: "900"
          GITHUB_RUN_ID: ${{ github.run_id }}-config
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python configure_paper_entry_pilot.py

      - name: Run exactly one paper entry cycle
        working-directory: backend
        env:
          PETRA_BROKER_ENV: paper
          ALLOW_LIVE_TRADING: "false"
          ALPACA_PAPER_API_KEY: ${{ secrets.ALPACA_PAPER_API_KEY }}
          ALPACA_PAPER_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}
          ALPACA_EXPECTED_ACCOUNT_NUMBER: ${{ secrets.ALPACA_EXPECTED_ACCOUNT_NUMBER }}
          MONGO_URL: ${{ secrets.PETRA_WORKER_MONGO_URL }}
          DB_NAME: ${{ vars.PETRA_DB_NAME || 'petra_paper' }}
          FEATHERLESS_API_KEY: ${{ secrets.FEATHERLESS_API_KEY }}
          ALPACA_OPTIONS_FEED: ${{ vars.ALPACA_OPTIONS_FEED || 'indicative' }}
          PETRA_ENTRIES_ENABLED: "true"
          PETRA_DRY_RUN: "false"
          TICK_MAX_CANDIDATES: "1"
          PETRA_LEASE_TTL_SECONDS: "900"
          GITHUB_RUN_ID: ${{ github.run_id }}-entry
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python worker.py
