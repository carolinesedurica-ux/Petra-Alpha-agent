name: Petra paper worker

on:
  schedule:
    # Off the top of the hour to reduce scheduler congestion.
    # Broad UTC window covers US market hours across DST; Alpaca /clock is authoritative.
    - cron: "7,22,37,52 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Shadow mode: evaluate/reconcile but submit no orders"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: petra-paper-worker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: paper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-worker.txt

      - name: Install Petra worker dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-worker.txt

      - name: Run Petra paper worker
        working-directory: backend
        env:
          PETRA_BROKER_ENV: paper
          ALLOW_LIVE_TRADING: "false"

          ALPACA_PAPER_API_KEY: ${{ secrets.ALPACA_PAPER_API_KEY }}
          ALPACA_PAPER_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}
          ALPACA_EXPECTED_ACCOUNT_NUMBER: ${{ secrets.ALPACA_EXPECTED_ACCOUNT_NUMBER }}

          MONGO_URL: ${{ secrets.PETRA_WORKER_MONGO_URL }}
          DB_NAME: ${{ vars.PETRA_DB_NAME || 'petra_paper' }}

          FEATHERLESS_API_KEY: ${{ secrets.FEATHERLESS_API_KEY }}
          ALPACA_OPTIONS_FEED: ${{ vars.ALPACA_OPTIONS_FEED || 'indicative' }}

          PETRA_ENTRIES_ENABLED: ${{ vars.PETRA_ENTRIES_ENABLED }}
          PETRA_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || vars.PETRA_DRY_RUN }}
          TICK_MAX_CANDIDATES: ${{ vars.TICK_MAX_CANDIDATES }}
          PETRA_LEASE_TTL_SECONDS: "900"

          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}

        run: python worker.py
